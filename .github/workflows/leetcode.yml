name: LeetCode Engine

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Execution Mode'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - stats
  repository_dispatch:
    types:
      - telegram_command

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Determine Mode
        id: set_mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.action_mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "MODE=${{ github.event.client_payload.mode }}" >> $GITHUB_OUTPUT
          else
            echo "MODE=sync" >> $GITHUB_OUTPUT
          fi

      - name: Execute Sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAZYRAION_WEBHOOK_URL: ${{ secrets.LAZYRAION_WEBHOOK_URL }}
        run: python sync_leetcode.py --mode ${{ steps.set_mode.outputs.MODE }}

      - name: Commit Code & Stats JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync solutions & update stats.json" && git push)
